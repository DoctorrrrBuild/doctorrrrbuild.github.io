<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to Doctor Converter</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #222;
            --text: #e0e0e0;
            --muted: #888;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 32px;
        }
        .converter {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .pane {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .pane-header {
            background: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pane-header span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .pane-header button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .pane-header button:hover {
            background: var(--primary-hover);
        }
        textarea {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: none;
            padding: 20px;
            font-family: 'Monaco', 'Consolas', 'SF Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            resize: none;
            outline: none;
        }
        .output-display {
            flex: 1;
            padding: 20px;
            font-family: 'Monaco', 'Consolas', 'SF Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn-secondary {
            background: #1a1a1a;
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: #252525;
        }
        .status {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            min-height: 20px;
        }
        @media (max-width: 768px) {
            .converter { grid-template-columns: 1fr; }
            .pane { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Markdown → Doctor</h1>
        <p class="subtitle">Paste Markdown on the left, get Doctor on the right. No terminal needed.</p>
        
        <div class="controls">
            <button class="btn" onclick="convert()">▶ Convert</button>
            <button class="btn btn-secondary" onclick="loadExample()">Load Example</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
        </div>
        
        <div class="converter">
            <div class="pane">
                <div class="pane-header">
                    <span>Markdown Input</span>
                    <button onclick="pasteFromClipboard()">Paste</button>
                </div>
                <textarea id="md-input" placeholder="# Hello World

This is a paragraph.

## Features

- Item one
- Item two

| Name | Value |
|------|-------|
| A    | 1     |
| B    | 2     |

```python
def hello():
    print('hi')
```" spellcheck="false"></textarea>
            </div>
            <div class="pane">
                <div class="pane-header">
                    <span>Doctor Output</span>
                    <button onclick="copyOutput()">Copy</button>
                </div>
                <div class="output-display" id="doctor-output">// Click Convert to see Doctor syntax</div>
            </div>
        </div>
        
        <p class="status" id="status"></p>
    </div>

    <script>
        function convert() {
            const input = document.getElementById('md-input').value;
            const output = document.getElementById('doctor-output');
            const status = document.getElementById('status');
            
            if (!input.trim()) {
                output.textContent = '// Enter some Markdown first';
                status.textContent = 'Nothing to convert';
                return;
            }
            
            const doctor = markdownToDoctor(input);
            output.textContent = doctor;
            status.textContent = `Converted! ${doctor.split('\n').length} lines`;
        }
        
        function markdownToDoctor(md) {
            const lines = md.split('\n');
            const out = [];
            let i = 0;
            let inCode = false;
            let codeLang = '';
            let codeLines = [];
            let inList = false;
            let listItems = [];
            let inTable = false;
            let tableRows = [];
            
            while (i < lines.length) {
                let line = lines[i];
                let stripped = line.trim();
                
                if (!stripped && !inCode && !inList && !inTable) {
                    i++;
                    continue;
                }
                
                // Code blocks
                if (stripped.startsWith('```')) {
                    if (!inCode) {
                        inCode = true;
                        codeLang = stripped.slice(3).trim() || 'text';
                        codeLines = [];
                    } else {
                        inCode = false;
                        out.push(`code# ${codeLang}`);
                        out.push(...codeLines);
                        out.push('end#');
                        out.push('');
                    }
                    i++;
                    continue;
                }
                
                if (inCode) {
                    codeLines.push(line);
                    i++;
                    continue;
                }
                
                // Horizontal rule
                if (stripped === '---' || stripped === '***' || stripped === '___') {
                    out.push('divider#');
                    out.push('');
                    i++;
                    continue;
                }
                
                // Headings
                if (stripped.match(/^#{1,6}\s/)) {
                    const level = stripped.match(/^(#+)\s/)[1].length;
                    const text = stripped.replace(/^#{1,6}\s/, '');
                    if (level === 1) out.push(`h1# ${text}`);
                    else if (level === 2) out.push(`h2# ${text}`);
                    else out.push(`h3# ${text}`);
                    i++;
                    continue;
                }
                
                // Blockquote
                if (stripped.startsWith('>')) {
                    const text = stripped.slice(1).trim();
                    const alertTypes = {
                        '⚠️': 'warning', 'warning': 'warning', '⚠': 'warning',
                        'ℹ️': 'info', 'info': 'info', 'ℹ': 'info',
                        '✅': 'success', 'success': 'success', '✓': 'success',
                        '❌': 'error', 'error': 'error', '✗': 'error',
                        '💡': 'tip', 'tip': 'tip'
                    };
                    let alertType = null;
                    for (const [ind, type] of Object.entries(alertTypes)) {
                        if (text.toLowerCase().includes(ind.toLowerCase())) {
                            alertType = type;
                            break;
                        }
                    }
                    if (alertType) {
                        out.push(`alert# ${alertType}`);
                        out.push(`p# ${text}`);
                    } else {
                        out.push(`p# ${text}`);
                    }
                    i++;
                    continue;
                }
                
                // Tables
                if (stripped.includes('|') && !inTable) {
                    if (i + 1 < lines.length && lines[i + 1].trim().match(/^[\s|:-]+$/)) {
                        inTable = true;
                        tableRows = [];
                        const headers = stripped.split('|').map(c => c.trim()).filter(c => c);
                        tableRows.push(headers.join(' | '));
                        i += 2;
                        continue;
                    }
                }
                
                if (inTable) {
                    if (!stripped || !stripped.includes('|')) {
                        inTable = false;
                        out.push(`table# ${tableRows[0]}`);
                        for (let r = 1; r < tableRows.length; r++) {
                            out.push(tableRows[r]);
                        }
                        out.push('end#');
                        out.push('');
                        if (stripped) continue;
                        i++;
                        continue;
                    }
                    const cells = stripped.split('|').map(c => c.trim()).filter(c => c);
                    tableRows.push(cells.join(' | '));
                    i++;
                    continue;
                }
                
                // Lists
                if (stripped.match(/^[-*+]\s/)) {
                    if (!inList) {
                        inList = true;
                        listItems = [];
                    }
                    listItems.push(stripped.replace(/^[-*+]\s/, ''));
                    i++;
                    continue;
                } else if (inList && (!stripped || !stripped.match(/^[-*+]\s/))) {
                    inList = false;
                    out.push('list#');
                    for (const item of listItems) {
                        out.push(`- ${item}`);
                    }
                    out.push('end#');
                    out.push('');
                    if (stripped) continue;
                    i++;
                    continue;
                }
                
                // Images
                const imgMatch = stripped.match(/^!\[(.*?)\]\((.*?)\)$/);
                if (imgMatch) {
                    out.push(`img# ${imgMatch[2]}|${imgMatch[1]}`);
                    i++;
                    continue;
                }
                
                // Links - convert to plain text with URL
                const linkMatch = stripped.match(/^\[(.*?)\]\((.*?)\)$/);
                if (linkMatch) {
                    out.push(`p# ${linkMatch[1]} (${linkMatch[2]})`);
                    i++;
                    continue;
                }
                
                // Inline formatting
                let text = stripped;
                text = text.replace(/\*\*(.*?)\*\*/g, '$1');
                text = text.replace(/\*(.*?)\*/g, '$1');
                text = text.replace(/__(.*?)__/g, '$1');
                text = text.replace(/_(.*?)_/g, '$1');
                text = text.replace(/`(.*?)`/g, '$1');
                
                if (text.trim()) {
                    out.push(`p# ${text.trim()}`);
                }
                
                i++;
            }
            
            // Close open blocks
            if (inTable) {
                out.push(`table# ${tableRows[0]}`);
                for (let r = 1; r < tableRows.length; r++) {
                    out.push(tableRows[r]);
                }
                out.push('end#');
            }
            
            if (inList) {
                out.push('list#');
                for (const item of listItems) {
                    out.push(`- ${item}`);
                }
                out.push('end#');
            }
            
            return out.join('\n');
        }
        
        function loadExample() {
            const example = `# Welcome to Doctor

> A single-file documentation language.

## Features

- Simple syntax
- Auto-deploy
- Dark mode

## Project Status

| Project | Year | Status |
|---------|------|--------|
| Project A | 2025 | Active |
| Project B | 2024 | Done |

## Quick Start

\`\`\`bash
npm install doctor
doctor build
\`\`\`

---

Made with love.`;
            document.getElementById('md-input').value = example;
            convert();
        }
        
        function clearAll() {
            document.getElementById('md-input').value = '';
            document.getElementById('doctor-output').textContent = '// Click Convert to see Doctor syntax';
            document.getElementById('status').textContent = '';
        }
        
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('md-input').value = text;
                convert();
            } catch (err) {
                document.getElementById('status').textContent = 'Could not access clipboard. Paste manually.';
            }
        }
        
        function copyOutput() {
            const output = document.getElementById('doctor-output').textContent;
            navigator.clipboard.writeText(output).then(() => {
                document.getElementById('status').textContent = 'Copied to clipboard!';
                setTimeout(() => {
                    document.getElementById('status').textContent = '';
                }, 2000);
            });
        }
        
        // Auto-convert on paste
        document.getElementById('md-input').addEventListener('input', () => {
            const status = document.getElementById('status');
            status.textContent = 'Type or click Convert';
        });
    </script>
</body>
</html>
